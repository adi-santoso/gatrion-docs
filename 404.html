<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Halaman tidak ditemukan · Gatrion Docs</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: { extend: {
        fontFamily: {
          sans: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'ui-monospace', 'monospace'],
        },
        animation: { 'fade-up': 'fadeUp .6s cubic-bezier(.16,1,.3,1) both', 'scale-in': 'scaleIn .25s cubic-bezier(.16,1,.3,1) both' },
        keyframes: {
          fadeUp: { from: { opacity: 0, transform: 'translateY(16px)' }, to: { opacity: 1, transform: 'translateY(0)' } },
          scaleIn: { from: { opacity: 0, transform: 'scale(.96) translateY(8px)' }, to: { opacity: 1, transform: 'scale(1) translateY(0)' } },
        },
      } },
    };
    (function () { if (localStorage.getItem('theme') !== 'light') document.documentElement.classList.add('dark'); })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    ::selection { background: rgba(139,92,246,.35); }
    .glow-orb { position: absolute; border-radius: 9999px; filter: blur(100px); pointer-events: none; }
    .bg-grid { background-image: linear-gradient(rgba(148,163,184,.05) 1px, transparent 1px), linear-gradient(90deg, rgba(148,163,184,.05) 1px, transparent 1px); background-size: 48px 48px; mask-image: radial-gradient(ellipse 70% 60% at 50% 50%, black 30%, transparent 100%); }
  </style>
</head>

<body class="min-h-screen bg-[#fafafa] font-sans text-zinc-600 antialiased dark:bg-[#09090b] dark:text-zinc-400">

  <div class="pointer-events-none fixed inset-0 overflow-hidden">
    <div class="glow-orb left-1/2 top-1/2 h-[440px] w-[720px] -translate-x-1/2 -translate-y-1/2 bg-violet-500/20 dark:bg-violet-600/20"></div>
  </div>
  <div class="bg-grid pointer-events-none fixed inset-0"></div>

  <!-- Theme toggle pojok -->
  <button id="themeToggle" class="fixed right-5 top-5 z-40 flex h-9 w-9 items-center justify-center rounded-full text-zinc-500 transition hover:bg-zinc-100 hover:text-zinc-900 dark:hover:bg-white/[.06] dark:hover:text-white" aria-label="Ganti tema">
    <svg id="iconSun" class="hidden h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 3v2m0 14v2m9-9h-2M5 12H3m15.36 6.36l-1.42-1.42M7.05 7.05L5.64 5.64m12.72 0l-1.42 1.42M7.05 16.95l-1.41 1.41M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
    <svg id="iconMoon" class="hidden h-[18px] w-[18px]" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
  </button>

  <main class="relative flex min-h-screen flex-col items-center justify-center px-5 text-center">

    <!-- Logo -->
    <a href="index.html" class="animate-fade-up mb-10 flex items-center gap-2.5">
      <span class="relative flex h-8 w-8 items-center justify-center">
        <span class="absolute inset-0 rounded-lg bg-gradient-to-br from-violet-500 to-fuchsia-600 opacity-90"></span>
        <span class="absolute inset-0 rounded-lg bg-gradient-to-br from-violet-500 to-fuchsia-600 blur-md opacity-40"></span>
        <span class="relative text-base font-extrabold text-white">G</span>
      </span>
      <span class="text-lg font-bold tracking-tight text-zinc-900 dark:text-white">gatrion<span class="text-zinc-400 dark:text-zinc-600">/</span><span class="bg-gradient-to-r from-violet-500 to-fuchsia-500 bg-clip-text text-transparent">docs</span></span>
    </a>

    <!-- 404 besar -->
    <h1 class="animate-fade-up bg-gradient-to-b from-zinc-900 to-zinc-400 bg-clip-text text-[7rem] font-extrabold leading-none tracking-tighter text-transparent [animation-delay:.05s] sm:text-[10rem] dark:from-white dark:to-zinc-700">404</h1>

    <h2 class="animate-fade-up mt-2 text-2xl font-bold tracking-tight text-zinc-900 [animation-delay:.1s] sm:text-3xl dark:text-white">Halaman tidak ditemukan</h2>
    <p class="animate-fade-up mt-3 max-w-md text-[15px] leading-relaxed text-zinc-500 [animation-delay:.15s] dark:text-zinc-400">Sepertinya halaman yang kamu cari sudah dipindahkan atau tidak pernah ada. Coba cari lewat command palette atau kembali ke hub.</p>

    <!-- Search + CTA -->
    <div class="animate-fade-up mt-8 flex w-full max-w-md flex-col gap-3 [animation-delay:.2s]">
      <button onclick="openPalette()" class="group flex w-full items-center gap-3 rounded-2xl border border-zinc-200 bg-white/80 px-5 py-3.5 text-left shadow-lg shadow-zinc-200/50 backdrop-blur transition hover:border-violet-300 dark:border-white/[.08] dark:bg-white/[.04] dark:shadow-black/20 dark:hover:border-violet-500/40">
        <svg class="h-5 w-5 text-zinc-400 transition group-hover:text-violet-500" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
        <span class="flex-1 text-[14px] text-zinc-400">Cari halaman...</span>
        <span class="hidden gap-1 sm:flex">
          <kbd class="rounded-md border border-zinc-200 bg-zinc-50 px-2 py-1 font-mono text-[11px] text-zinc-400 dark:border-white/[.08] dark:bg-white/[.04]">Ctrl</kbd>
          <kbd class="rounded-md border border-zinc-200 bg-zinc-50 px-2 py-1 font-mono text-[11px] text-zinc-400 dark:border-white/[.08] dark:bg-white/[.04]">K</kbd>
        </span>
      </button>
      <div class="flex gap-3">
        <a href="index.html" class="inline-flex flex-1 items-center justify-center gap-2 rounded-xl bg-zinc-900 px-5 py-2.5 text-sm font-semibold text-white shadow-lg transition hover:bg-zinc-800 dark:bg-white dark:text-zinc-900 dark:hover:bg-zinc-100">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l9-9 9 9M5 10v10a1 1 0 001 1h3a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1h3a1 1 0 001-1V10"/></svg>
          Ke Hub
        </a>
        <button onclick="history.back()" class="inline-flex flex-1 items-center justify-center gap-2 rounded-xl border border-zinc-200 bg-white/60 px-5 py-2.5 text-sm font-semibold text-zinc-700 transition hover:border-zinc-300 dark:border-white/[.1] dark:bg-white/[.03] dark:text-zinc-200 dark:hover:border-white/[.2]">
          <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
          Kembali
        </button>
      </div>
    </div>

    <!-- Quick links -->
    <div class="animate-fade-up mt-10 flex flex-wrap items-center justify-center gap-x-5 gap-y-2 text-[13px] [animation-delay:.25s]">
      <a href="index.html" class="text-zinc-400 transition hover:text-violet-500">Semua Project</a>
      <span class="text-zinc-300 dark:text-zinc-700">·</span>
      <a href="docs-core-api.html" class="text-zinc-400 transition hover:text-violet-500">Getting Started</a>
      <span class="text-zinc-300 dark:text-zinc-700">·</span>
      <a href="api-reference.html" class="text-zinc-400 transition hover:text-violet-500">API Reference</a>
      <span class="text-zinc-300 dark:text-zinc-700">·</span>
      <a href="changelog.html" class="text-zinc-400 transition hover:text-violet-500">Changelog</a>
    </div>
  </main>

  <!-- ============ COMMAND PALETTE ============ -->
  <div id="palette" class="fixed inset-0 z-50 hidden">
    <div class="absolute inset-0 bg-zinc-950/40 backdrop-blur-sm dark:bg-zinc-950/60" onclick="closePalette()"></div>
    <div class="animate-scale-in relative mx-auto mt-[12vh] w-[92%] max-w-xl overflow-hidden rounded-2xl border border-zinc-200 bg-white shadow-2xl dark:border-white/[.1] dark:bg-[#111113]">
      <div class="flex items-center gap-3 border-b border-zinc-100 px-4 dark:border-white/[.06]">
        <svg class="h-4 w-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" d="M21 21l-4.35-4.35M11 19a8 8 0 100-16 8 8 0 000 16z"/></svg>
        <input id="paletteInput" type="text" placeholder="Ketik untuk mencari halaman..." class="w-full bg-transparent py-4 text-sm text-zinc-900 placeholder-zinc-400 outline-none dark:text-white" autocomplete="off" />
        <kbd class="rounded-md border border-zinc-200 px-1.5 py-0.5 font-mono text-[10px] text-zinc-400 dark:border-white/[.1]">esc</kbd>
      </div>
      <div id="paletteResults" class="max-h-[320px] overflow-y-auto p-2"></div>
      <div class="flex items-center gap-4 border-t border-zinc-100 px-4 py-2.5 text-[11px] text-zinc-400 dark:border-white/[.06]">
        <span class="flex items-center gap-1"><kbd class="rounded border border-zinc-200 px-1 font-mono dark:border-white/[.1]">↑↓</kbd> navigasi</span>
        <span class="flex items-center gap-1"><kbd class="rounded border border-zinc-200 px-1 font-mono dark:border-white/[.1]">↵</kbd> buka</span>
      </div>
    </div>
  </div>

  <script>
    const html = document.documentElement, iconSun = document.getElementById('iconSun'), iconMoon = document.getElementById('iconMoon');
    function syncIcon(){ const d = html.classList.contains('dark'); iconSun.classList.toggle('hidden', !d); iconMoon.classList.toggle('hidden', d); }
    syncIcon();
    document.getElementById('themeToggle').addEventListener('click', () => { html.classList.toggle('dark'); localStorage.setItem('theme', html.classList.contains('dark') ? 'dark' : 'light'); syncIcon(); });

    const PAGES = [
      { title: 'Hub — Semua Project', project: 'Home', url: 'index.html', icon: '🏠' },
      { title: 'Core API — Overview', project: 'Core API', url: 'project-overview.html', icon: '📊' },
      { title: 'Getting Started', project: 'Core API', url: 'docs-core-api.html', icon: '⚡' },
      { title: 'API Reference', project: 'Core API', url: 'api-reference.html', icon: '🧩' },
      { title: 'Changelog', project: 'Global', url: 'changelog.html', icon: '🗒️' },
    ];
    const palette = document.getElementById('palette'), paletteInput = document.getElementById('paletteInput'), paletteResults = document.getElementById('paletteResults');
    let selIndex = 0, filtered = PAGES;
    function renderResults(){
      if(!filtered.length){ paletteResults.innerHTML = '<p class="px-4 py-8 text-center text-sm text-zinc-400">Tidak ada hasil.</p>'; return; }
      paletteResults.innerHTML = filtered.map((p,i)=>`<a href="${p.url}" class="flex items-center gap-3 rounded-xl px-3 py-2.5 text-sm transition ${i===selIndex?'bg-violet-500/10 text-violet-600 dark:text-violet-300':'text-zinc-600 hover:bg-zinc-50 dark:text-zinc-300 dark:hover:bg-white/[.04]'}"><span class="text-base">${p.icon}</span><span class="flex-1 font-medium">${p.title}</span><span class="rounded-md bg-zinc-100 px-2 py-0.5 text-[10px] font-medium text-zinc-400 dark:bg-white/[.06]">${p.project}</span></a>`).join('');
    }
    function openPalette(){ palette.classList.remove('hidden'); paletteInput.value=''; filtered=PAGES; selIndex=0; renderResults(); setTimeout(()=>paletteInput.focus(),30); }
    function closePalette(){ palette.classList.add('hidden'); }
    paletteInput.addEventListener('input', () => { const q = paletteInput.value.toLowerCase(); filtered = PAGES.filter(p => (p.title+' '+p.project).toLowerCase().includes(q)); selIndex = 0; renderResults(); });
    document.addEventListener('keydown', (e) => {
      if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); palette.classList.contains('hidden')?openPalette():closePalette(); }
      if(palette.classList.contains('hidden')) return;
      if(e.key==='Escape') closePalette();
      if(e.key==='ArrowDown'){ e.preventDefault(); selIndex=Math.min(selIndex+1,filtered.length-1); renderResults(); }
      if(e.key==='ArrowUp'){ e.preventDefault(); selIndex=Math.max(selIndex-1,0); renderResults(); }
      if(e.key==='Enter'&&filtered[selIndex]) window.location.href=filtered[selIndex].url;
    });
  </script>
</body>
</html>
